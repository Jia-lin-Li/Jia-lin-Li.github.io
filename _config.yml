title: Jialin Li
name: Jialin Li
description: "Jialin Li studies stochastic black-box models and uncertainty quantification seeking new perspectives, new frameworks, and new models at the intersection of statistics and operations. Explore papers and teaching."
url: https://Jia-lin-Li.github.io
baseurl: ""
theme: null
public_site: true
author:
  title: Visiting Assistant Professor
  department: Department of Mathematics and Statistics
  university: University of Massachusetts Amherst
  email: jialinl@umass.edu
analytics:
  enabled: true
  measurement_id: G-7WWRGCV8XR
google_site_verifications:
  - KiNHMQt1qvf1p9prv77wkIoYZsF7lMhvF6QOLNDtfHs
  - EoqR7u1VKcu0qPKFdBQBP1EC_sGPk5DDn303EG0KNsQ
include: [_pages, files]
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - README.md
  - Preview.command
  - scripts
  - vendor
  - .bundle
  - .github
  - .DS_Store
  - "**/.DS_Store"
  - .Rhistory
  - "**/.Rhistory"
  - node_modules
  - tmp
  - backups
  - _site-preview
  - _production-site
encoding: utf-8
markdown: kramdown
kramdown:
  input: GFM
plugins: [jekyll-redirect-from, jekyll-sitemap]
redirect_from:
  json: false
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      noindex: true
      sitemap: false
  - scope:
      path: _pages/about.md
    values:
      noindex: false
      sitemap: true
      seo_title: Jialin Li - Uncertainty Quantification
      og_description: "Research in stochastic black-box models and uncertainty quantification. Publications, working papers, teaching, and CV."
  - scope:
      path: _pages/teaching.md
    values:
      noindex: false
      sitemap: true
      description: "Jialin Li's teaching experience in statistics and mathematics at the University of Massachusetts Amherst and the University of Maryland, College Park."
