<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Main navigation">
        <button type="button" class="hidden" aria-label="Navigation menu" aria-expanded="false" aria-controls="navigation-overflow"><span class="navicon" aria-hidden="true"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}<li class="masthead__menu-item"><a href="{{ link.url | prepend: base_path }}">{{ link.title }}</a></li>{% endfor %}
        </ul>
        <ul id="navigation-overflow" class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
